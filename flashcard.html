<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AWS CLF-C02 Flashcards</title>
    <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%236c5ce7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>'>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800&display=swap" rel="stylesheet">
    <style>
    :root {
        --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
        --glass-bg: rgba(255, 255, 255, 0.8);
        --glass-border: rgba(0, 0, 0, 0.05);
        --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.05);
        --text-main: #2d3436;
        --text-sub: #636e72;
        --card-face: #ffffff;
        --accent: #2a6c66;
        --accent-glow: rgba(9, 132, 227, 0.1);
        --danger: #d63031;
        --btn-bg: rgba(0, 0, 0, 0.03);
    }

    [data-theme="dark"] {
        --bg-gradient: linear-gradient(135deg, #2d1b2e 0%, #462424 100%);
        --glass-bg: rgba(60, 37, 61, 0.7);
        --glass-border: rgba(255, 200, 200, 0.1);
        --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
        --text-main: #f5cdc6;
        --text-sub: #bbaaaa;
        --card-face: #1a0f1a;
        --accent: #ff7675;
        --accent-glow: rgba(255, 118, 117, 0.2);
        --btn-bg: rgba(255, 255, 255, 0.08);
    }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: var(--text-main);
            transition: color 0.3s ease;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .orb { position: absolute; border-radius: 50%; filter: blur(80px); z-index: -1; animation: float 20s infinite; pointer-events: none; }
        .orb-1 { width: 300px; height: 300px; background: var(--accent); top: -10%; left: -10%; opacity: 0.4; }
        .orb-2 { width: 400px; height: 400px; background: #fd79a8; bottom: -10%; right: -10%; opacity: 0.3; animation-delay: -5s; }
        @keyframes float { 0% { transform: translate(0, 0); } 50% { transform: translate(30px, 50px); } 100% { transform: translate(0, 0); } }

        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            position: relative;
        }

        .header-bar {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            padding: 10px 20px;
            background: var(--glass-bg);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            margin-bottom: 20px;
            box-shadow: var(--glass-shadow);
            flex-shrink: 0;
            gap: 15px;
        }

        .header-left { 
            justify-self: start; 
        }
        
        .back-btn {
            background: var(--btn-bg);
            border: 1px solid transparent;
            color: var(--text-main);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            width: 36px; height: 36px;
            border-radius: 50%;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .back-btn:hover { background: var(--glass-border); transform: scale(1.05); }

        .domain-badge-container {
            justify-self: start;
            text-align: left;
            min-width: 0;
        }

        .domain-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center; 
            height: 100%; 
            min-height: 32px; 
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 800;
            color: var(--accent);
            background: var(--accent-glow);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(108, 92, 231, 0.1);
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .actions { 
            justify-self: end;
            display: flex; 
            gap: 8px; 
            align-items: center; 
        }

        .icon-btn {
            background: var(--btn-bg);
            border: 1px solid transparent;
            color: var(--text-main);
            cursor: pointer;
            width: 38px; height: 38px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .icon-btn:hover { background: var(--glass-border); transform: scale(1.05); }
        .icon-btn.active { color: var(--danger); background: rgba(255, 118, 117, 0.15); border-color: var(--danger); }
        
        .exam-btn {
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-main);
            border: 1px solid var(--text-main);
            padding: 8px 16px;
            border-radius: 20px;
            white-space: nowrap;
            opacity: 0.8;
            transition: all 0.2s;
        }
        .exam-btn:hover { background: var(--text-main); color: var(--card-face); opacity: 1; }

        .card-scene {
            flex: 1; 
            width: 100%;
            perspective: 2000px;
            margin-bottom: 20px;
            position: relative;
            display: flex; 
            align-items: center;
            justify-content: center;
        }

        .card {
            width: 100%;
            height: 100%;
            max-height: 550px; 
            max-width: 700px;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
            border-radius: 30px;
            box-shadow: var(--glass-shadow);
            cursor: pointer;
        }

        .card.flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute;
            width: 100%; height: 100%;
            backface-visibility: hidden;
            border-radius: 30px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: var(--card-face);
            border: 1px solid var(--glass-border);
            overflow-y: auto; 
        }

        [data-theme="light"] .card-face { background: rgba(255,255,255,0.9); }
        
        .question-text { 
            font-size: 1.6rem; 
            font-weight: 600; 
            line-height: 1.4; 
            margin-bottom: 30px;
            color: var(--text-main);
        }
        
        .tap-hint {
            position: absolute;
            bottom: 25px;
            font-size: 0.75rem;
            color: var(--text-sub);
            opacity: 0.5;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .card-back {
            transform: rotateY(180deg);
            align-items: stretch;
            text-align: left;
            justify-content: flex-start;
            padding-top: 60px;
        }

        .answer-label { font-size: 0.8rem; color: var(--accent); font-weight: 800; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
        .answer-text { font-size: 1.4rem; font-weight: 700; margin-bottom: 30px; color: var(--text-main); line-height: 1.3; }
        
        .explanation-box { 
            background: var(--accent-glow); 
            padding: 25px; 
            border-radius: 20px; 
            font-size: 1rem; 
            line-height: 1.7;
            color: var(--text-main);
            border-left: 4px solid var(--accent);
        }

        .controls-bar {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 20px;
            align-items: center;
            padding-bottom: 10px;
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
        }

        .nav-btn {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            height: 65px;
            border-radius: 25px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex; align-items: center; justify-content: center;
            box-shadow: var(--glass-shadow);
        }
        .nav-btn:hover { background: var(--glass-border); transform: translateY(-2px); }
        .nav-btn:active { transform: scale(0.96); }

        .heart-btn-large {
            width: 65px; height: 65px;
            border-radius: 25px;
            background: var(--card-face);
            border: 1px solid var(--glass-border);
            color: #ccc;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.6rem;
            box-shadow: var(--glass-shadow);
            transition: all 0.2s;
        }
        .heart-btn-large.active { color: var(--danger); border-color: var(--danger); background: rgba(255, 118, 117, 0.1); }
        .heart-btn-large:active { transform: scale(0.9); }

        .progress-indicator { text-align: center; font-size: 0.85rem; color: var(--text-sub); margin-top: 15px; opacity: 0.8; font-weight: 500; letter-spacing: 1px; }

        .loader-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-gradient);
            z-index: 100;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            text-align: center;
            padding: 30px;
        }
        .loader-content {
            background: var(--glass-bg);
            -webkit-backdrop-filter: blur(25px);
            backdrop-filter: blur(25px);
            padding: 50px;
            border-radius: 40px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            max-width: 450px; width: 100%;
        }
        .btn-load {
            display: block; width: 100%;
            padding: 18px; margin-top: 20px;
            border-radius: 16px; border: none;
            font-weight: 700; cursor: pointer; font-size: 1.1rem;
            transition: transform 0.2s;
        }
        .btn-load.primary { background: #2d3436; color: white; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        [data-theme="dark"] .btn-load.primary { background: #ffffff; color: #000; }
        
        .btn-load.secondary { background: transparent; border: 2px solid var(--text-main); color: var(--text-main); opacity: 0.7; }
        .btn-load:hover { transform: translateY(-3px); opacity: 1; }

        /* Custom Alert Styles */
        .alert-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 200;
            display: none;
            justify-content: center; align-items: center;
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            padding: 20px;
        }
        .alert-box {
            background: var(--glass-bg);
            -webkit-backdrop-filter: blur(30px);
            backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            padding: 30px;
            border-radius: 30px;
            max-width: 400px; width: 100%;
            text-align: center;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .alert-title { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; color: var(--text-main); }
        .alert-msg { margin-bottom: 25px; line-height: 1.5; color: var(--text-sub); font-size: 1rem; }
        .alert-btn {
            background: var(--text-main);
            color: var(--card-face);
            border: none;
            padding: 12px 30px;
            border-radius: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s;
            font-size: 1rem;
        }
        .alert-btn:hover { transform: scale(1.05); }

        @media (max-width: 768px) {
            .app-container { padding: 15px; }
            
            .header-bar {
                grid-template-columns: 1fr auto; 
                grid-template-areas: 
                    "badge badge"
                    "left actions";
                row-gap: 12px;
                border-radius: 30px;
                padding: 12px 20px;
            }
            .header-left { grid-area: left; }
            .actions { grid-area: actions; }
            .domain-badge-container { 
                grid-area: badge; 
                width: 100%;
                text-align: center;
                justify-self: center;
            }
            .domain-badge { 
                display: block; 
                width: 100%; 
                white-space: normal; 
                font-size: 0.7rem;
                padding: 8px;
            }

            .question-text { font-size: 1.3rem; }
            .card-face { padding: 25px; }
            
            .controls-bar { gap: 12px; }
            .nav-btn, .heart-btn-large { height: 56px; border-radius: 18px; }
        }
    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="loader-overlay" id="loader">
        <div class="loader-content">
            <h1 style="margin-bottom: 15px; font-size: 2.2rem; font-weight: 800;">Flashcards</h1>
            <p style="opacity: 0.8; margin-bottom: 40px; font-size: 1.1rem; line-height: 1.5;">Master AWS CLF-C02 concepts<br>with spaced repetition.</p>
            
            <button id="use-internal" class="btn-load primary">Use Question Bank</button>
            
            <label class="btn-load secondary">
                Upload Custom File
                <input type="file" id="file-input" hidden accept=".json">
            </label>
        </div>
    </div>

    <div class="app-container" style="display:none;" id="app-ui">
        
        <header class="header-bar">
            <div class="header-left">
                <button class="back-btn" id="exit-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                </button>
            </div>
            
            <div class="domain-badge-container">
                <span class="domain-badge" id="domain-text">--</span>
            </div>
            
            <div class="actions">
                <a href="mock.html" class="exam-btn">Take Exam</a>
                
                <button class="icon-btn" id="fav-filter-btn" title="Show Favorites Only">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                </button>
                <button class="icon-btn" id="theme-toggle">
                    <svg width="20" height="20" class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                </button>
            </div>
        </header>

        <div class="card-scene" id="card-scene">
            <div class="card" id="card">
                <div class="card-face card-front">
                    <p class="question-text" id="q-text">Loading...</p>
                    <span class="tap-hint">Tap to flip</span>
                </div>
                <div class="card-face card-back">
                    <span class="answer-label">Correct Answer</span>
                    <div class="answer-text" id="a-text">--</div>
                    <div class="explanation-box" id="exp-text">--</div>
                </div>
            </div>
        </div>

        <div class="controls-bar">
            <button class="nav-btn" id="btn-prev">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            
            <button class="heart-btn-large" id="btn-heart">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
            </button>

            <button class="nav-btn" id="btn-next">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
            </button>
        </div>
        
        <div class="progress-indicator" id="counter">--</div>
    </div>

    <div class="alert-overlay" id="custom-alert">
        <div class="alert-box">
            <h2 class="alert-title" id="alert-title">Notice</h2>
            <p class="alert-msg" id="alert-msg">Message goes here</p>
            <button class="alert-btn" id="alert-ok">Okay</button>
        </div>
    </div>

    <script>
        // Fallback Data if fetch fails
        const DEMO_DATA = [
        {
            "id": 1,
            "question": "Which component of the AWS Global Infrastructure consists of one or more discrete data centers with redundant power, networking, and connectivity in an AWS Region?",
            "options": [
            "Availability Zone",
            "Edge Location",
            "Local Zone",
            "Regional Cache"
            ],
            "answer": [
            "Availability Zone"
            ],
            "type": "single_choice",
            "domain": "Cloud Concepts",
            "explanation": "An Availability Zone (AZ) is a distinct location within an AWS Region that is insulated from failures in other AZs and provides low-latency network connectivity to other AZs in the same region."
        },
        {
            "id": 2,
            "question": "Under the AWS Shared Responsibility Model, which of the following is the customer's responsibility? (Select TWO)",
            "options": [
            "Physical security of data centers",
            "Patching the Guest OS (Operating System)",
            "Configuration of Security Groups",
            "Discarding failed hard drives",
            "Patching the underlying hypervisor"

            "answer": [
            "Patching the Guest OS (Operating System)",
            "Configuration of Security Groups"
            ],
            "type": "multiple_response",
            "domain": "Security and Compliance",
            "explanation": "AWS handles security 'of' the cloud (physical hardware, hypervisor). Customers handle security 'in' the cloud (Guest OS patching, firewall configuration, data encryption)."
        },
        {
            "id": 3,
            "question": "A company wants to migrate a database to AWS but requires the operating system to be patched automatically by AWS. Which service should they choose?",
            "options": [
            "Amazon EC2 with EBS",
            "Amazon RDS",
            "Amazon Redshift",
            "Amazon EC2 with Instance Store"
            ],
            "answer": [
            "Amazon RDS"
            ],
            "type": "single_choice",
            "domain": "Cloud Technology and Services",
            "explanation": "Amazon RDS is a managed service. AWS handles routine database tasks such as provisioning, patching, backup, and recovery. EC2 requires the customer to manage the OS and patches."
        },
        {
            "id": 4,
            "question": "Which AWS service helps you estimate the cost of your architecture solution before you build it?",
            "options": [
            "AWS Cost Explorer",

            "AWS Budgets",
            "Cost and Usage Report"

            "answer": [
            "AWS Pricing Calculator"

            "domain": "Billing, Pricing, and Support",

        {
            "id": 5,

            "domain": "Cloud Technology and Services",
            "explanation": "Amazon CloudFront is a Content Delivery Network (CDN) that caches data in Edge Locations closer to the user to decrease latency."
        },
        {
            "id": 7,
            "question": "A developer needs to store source code and version control it within AWS. Which service is the most appropriate?",

        {

            "question": "Which AWS Support Plan provides access to a Technical Account Manager (TAM)?",

            "Enterprise"

            "answer": [
            "Enterprise"

            "domain": "Billing, Pricing, and Support",
            "explanation": "Only the Enterprise Support plan includes a designated Technical Account Manager (TAM) to assist with architectural guidance and operations."
        },
        {
            "id": 9,
            "question": "Which service allows you to inspect AWS resource configurations to determine if they comply with internal practices and industry standards?",
            "options": [
            "AWS Config",
            "AWS CloudTrail",

            "answer": [
            "AWS Config"

            "domain": "Security and Compliance",
            "explanation": "AWS Config provides a detailed view of the configuration of AWS resources in your AWS account. It includes how the resources are related to one another and how they were configured in the past so that you can see how the configurations and relationships change over time."
        },
        {
            "id": 10,
            "question": "What is the primary benefit of decoupling an application using Amazon SQS?",
            "options": [
            "It reduces the storage cost of the application.",
            "It prevents one component from failing if another component becomes overwhelmed or fails.",

        class FlashApp {
            constructor() {
                this.allQuestions = [];
                this.activePool = [];
                this.currentIndex = 0;
                this.favorites = JSON.parse(localStorage.getItem('aws_favs') || '[]');
                this.viewMode = 'all'; 
                
                this.ui = {
                    loader: document.getElementById('loader'),
                    app: document.getElementById('app-ui'),
                    card: document.getElementById('card'),
                    qText: document.getElementById('q-text'),
                    aText: document.getElementById('a-text'),
                    expText: document.getElementById('exp-text'),
                    domain: document.getElementById('domain-text'),
                    counter: document.getElementById('counter'),
                    heartBtn: document.getElementById('btn-heart'),
                    favFilterBtn: document.getElementById('fav-filter-btn'),
                    themeBtn: document.getElementById('theme-toggle'),
                    fileInput: document.getElementById('file-input'),
                    internalBtn: document.getElementById('use-internal'),
                    exitBtn: document.getElementById('exit-btn'),
                    
                    // Alert Elements
                    alertOverlay: document.getElementById('custom-alert'),
                    alertTitle: document.getElementById('alert-title'),
                    alertMsg: document.getElementById('alert-msg'),
                    alertBtn: document.getElementById('alert-ok')
                };

                this.init();
            }

            init() {
                this.ui.fileInput.addEventListener('change', (e) => this.handleFile(e.target.files[0]));
                this.ui.internalBtn.addEventListener('click', () => this.fetchInternalBank());
                this.ui.exitBtn.addEventListener('click', () => this.exitStudy());
                
                this.ui.card.addEventListener('click', () => this.ui.card.classList.toggle('flipped'));
                
                document.getElementById('btn-next').addEventListener('click', (e) => { e.stopPropagation(); this.next(); });
                document.getElementById('btn-prev').addEventListener('click', (e) => { e.stopPropagation(); this.prev(); });
                this.ui.heartBtn.addEventListener('click', (e) => { e.stopPropagation(); this.toggleFavorite(); });
                this.ui.favFilterBtn.addEventListener('click', (e) => { e.stopPropagation(); this.toggleViewMode(); });
                this.ui.themeBtn.addEventListener('click', (e) => { e.stopPropagation(); this.toggleTheme(); });
                this.ui.alertBtn.addEventListener('click', () => this.closeAlert());

                document.addEventListener('keydown', (e) => {
                    if (this.ui.app.style.display === 'none') return;
                    if (e.code === 'Space') { e.preventDefault(); this.ui.card.classList.toggle('flipped'); }
                    if (e.code === 'ArrowRight') this.next();
                    if (e.code === 'ArrowLeft') this.prev();
                    if (e.code === 'Enter' && this.ui.alertOverlay.style.display === 'flex') this.closeAlert();
                });

                this.loadTheme();
            }

            showAlert(title, msg) {
                this.ui.alertTitle.textContent = title;
                this.ui.alertMsg.textContent = msg;
                this.ui.alertOverlay.style.display = 'flex';
            }

            closeAlert() {
                this.ui.alertOverlay.style.display = 'none';
            }

            async fetchInternalBank() {
                try {
                    const response = await fetch('questions.json');
                    if (!response.ok) throw new Error("Local file fetch blocked");
                    const json = await response.json();
                    this.loadData(json);
                } catch (err) {
                    console.warn("Fetch failed, using DEMO_DATA fallback.");
                    this.loadData(DEMO_DATA);
                    // Silent failover for better UX, or alert if you prefer:
                    // this.showAlert("Loaded Demo Data", "Could not load 'questions.json' (CORS restriction). Loaded built-in demo set instead.");
                }
            }

            async handleFile(file) {
                try {
                    const text = await file.text();
                    const json = JSON.parse(text);
                    this.loadData(json);
                } catch (err) {
                    this.showAlert("File Error", "Invalid JSON file. Please check the format.");
                }
            }

            loadData(data) {
                this.allQuestions = data.sort(() => 0.5 - Math.random());
                this.activePool = this.allQuestions;
                this.currentIndex = 0;
                
                this.ui.loader.style.display = 'none';
                this.ui.app.style.display = 'flex';
                this.renderCard();
            }

            renderCard() {
                if (this.activePool.length === 0) {
                    this.ui.qText.textContent = "No cards found in this set.";
                    this.ui.domain.textContent = "--";
                    return;
                }

                const q = this.activePool[this.currentIndex];
                this.ui.card.classList.remove('flipped');
                this.ui.domain.textContent = q.domain || "General";
                this.ui.qText.textContent = q.question;
                
                const ansStr = Array.isArray(q.answer) ? q.answer.join(", ") : q.answer;
                this.ui.aText.textContent = ansStr;
                this.ui.expText.textContent = q.explanation || "No explanation provided.";
                
                this.ui.counter.textContent = `${this.currentIndex + 1} / ${this.activePool.length}`;

                const isFav = this.favorites.includes(q.id);
                if(isFav) this.ui.heartBtn.classList.add('active');
                else this.ui.heartBtn.classList.remove('active');
            }

            next() {
                if (this.currentIndex < this.activePool.length - 1) {
                    this.currentIndex++;
                    this.renderCard();
                } else {
                    this.currentIndex = 0; 
                    this.renderCard();
                }
            }

            prev() {
                if (this.currentIndex > 0) {
                    this.currentIndex--;
                    this.renderCard();
                }
            }

            toggleFavorite() {
                const q = this.activePool[this.currentIndex];
                const index = this.favorites.indexOf(q.id);
                if (index === -1) {
                    this.favorites.push(q.id);
                    this.ui.heartBtn.classList.add('active');
                } else {
                    this.favorites.splice(index, 1);
                    this.ui.heartBtn.classList.remove('active');
                    if(this.viewMode === 'fav') {
                        this.activePool = this.allQuestions.filter(q => this.favorites.includes(q.id));
                        if(this.currentIndex >= this.activePool.length) {
                            this.currentIndex = Math.max(0, this.activePool.length - 1);
                        }
                        if(this.activePool.length === 0) {
                            this.showAlert("Empty List", "No favorites left. Switching to All Cards.");
                            this.toggleViewMode();
                            return;
                        }
                        this.renderCard();
                    }
                }
                localStorage.setItem('aws_favs', JSON.stringify(this.favorites));
            }

            toggleViewMode() {
                this.viewMode = this.viewMode === 'all' ? 'fav' : 'all';
                if (this.viewMode === 'fav') {
                    const favs = this.allQuestions.filter(q => this.favorites.includes(q.id));
                    if (favs.length === 0) {
                        this.showAlert("No Favorites", "You haven't marked any cards as favorites yet!");
                        this.viewMode = 'all'; 
                        return;
                    }
                    this.activePool = favs;
                    this.ui.favFilterBtn.classList.add('active');
                } else {
                    this.activePool = this.allQuestions;
                    this.ui.favFilterBtn.classList.remove('active');
                }
                this.currentIndex = 0;
                this.renderCard();
            }

            exitStudy() {
                this.ui.app.style.display = 'none';
                this.ui.loader.style.display = 'flex';
                this.allQuestions = [];
                this.activePool = [];
                this.ui.favFilterBtn.classList.remove('active');
                this.viewMode = 'all';
            }

            toggleTheme() {
                const body = document.body;
                if (body.getAttribute('data-theme') === 'dark') {
                    body.removeAttribute('data-theme');
                    localStorage.setItem('fc_theme', 'light');
                } else {
                    body.setAttribute('data-theme', 'dark');
                    localStorage.setItem('fc_theme', 'dark');
                }
            }

            loadTheme() {
                if (localStorage.getItem('fc_theme') === 'dark') {
                    document.body.setAttribute('data-theme', 'dark');
                }
            }
        }

        new FlashApp();
    </script>
